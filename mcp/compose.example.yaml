services:
  career-mcp:
    image: career-mcp:1.0.0
    pull_policy: never
    restart: unless-stopped
    env_file:
      - /data/career-mcp/career-mcp-runtime.env
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
